<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bon voyage</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#e9e9e9; font-family:"Helvetica Neue", Arial, sans-serif; padding:24px; text-align:center; }
  .card { background:#fff; max-width:560px; width:100%; border-top:14px solid #c8101e;
          box-shadow:0 10px 35px rgba(0,0,0,.25); padding:36px; }
  h1 { margin:0 0 12px; color:#c8101e; }
  p { font-size:17px; line-height:1.5; color:#333; margin:0; }
  .kicker { font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:#888; margin-bottom:6px; }
  .reveal { font-size:56px; font-weight:700; color:#000; line-height:1;
            letter-spacing:.03em; margin:4px 0 0; animation:pop .9s ease-out both; }
  @keyframes pop { 0% { opacity:0; transform:scale(.6); }
                   70% { opacity:1; transform:scale(1.08); }
                   100% { transform:scale(1); } }
</style>
</head>
<body>
  <main class="card">
    <h1>Boarding completed – Bon voyage!</h1>
    <div class="reveal">11:30</div>
  </main>
</body>
</html>
