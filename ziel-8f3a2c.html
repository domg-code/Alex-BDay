<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bon voyage</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#e9e9e9; font-family:"Helvetica Neue", Arial, sans-serif; padding:24px; }
  .card { background:#fff; max-width:560px; width:100%; border-top:14px solid #c8101e;
          box-shadow:0 10px 35px rgba(0,0,0,.25); padding:36px;
          animation:fade .8s ease-out both; }
  @keyframes fade { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
  h1 { margin:0 0 26px; color:#c8101e; text-align:center; font-size:24px; }
  h2 { margin:0 0 18px; color:#000; font-size:22px; letter-spacing:.04em;
       text-transform:uppercase; border-bottom:2px solid #000; padding-bottom:8px; }
  .section { margin-bottom:22px; color:#000; }
  .label { font-size:12px; letter-spacing:.14em; text-transform:uppercase;
           color:#000; font-weight:700; margin-bottom:8px; }
  .flight { display:grid; grid-template-columns:auto 1fr; column-gap:16px; row-gap:2px;
            padding:10px 0; border-bottom:1px dotted #bbb; font-size:16px; color:#000; }
  .flight:last-child { border-bottom:0; }
  .flight .date { font-weight:700; }
  .flight .route { font-weight:700; text-align:right; }
  .flight .meta { color:#000; }
  .flight .meta.r { text-align:right; }
  .value { font-size:17px; font-weight:700; color:#000; }
  .final { text-align:center; margin-top:30px; padding-top:22px; border-top:2px solid #000; }
  .final .time { font-size:44px; font-weight:700; color:#000; line-height:1.1; margin-top:4px; }
  @media (max-width:420px) { .card { padding:24px; } .flight { font-size:15px; } }
</style>
</head>
<body>
  <main class="card">
    <h1>Boarding completed – Bon voyage!</h1>

    <h2>Itinerary</h2>

    <div class="section">
      <div class="label">Flights</div>
      <div class="flight">
        <span class="date">18.12.2026</span><span class="route">ZRH → CDG</span>
        <span class="meta">17:40</span><span class="meta r">LX644</span>
      </div>
      <div class="flight">
        <span class="date">20.12.2026</span><span class="route">CDG → ZRH</span>
        <span class="meta">19:55</span><span class="meta r">LX645</span>
      </div>
    </div>

    <div class="section">
      <div class="label">Hotel</div>
      <div class="value">citizenM Paris Opera</div>
    </div>

    <div class="final">
      <div class="label">Last puzzle</div>
      <div class="time">11:30</div>
    </div>
  </main>
</body>
</html>
